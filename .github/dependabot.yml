# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      # Test-only SQLite driver. Newer releases require Go 1.26, and a module's go
      # line applies to every app that installs it; revisit when Go 1.25 is dropped.
      - dependency-name: "github.com/ncruces/go-sqlite3"
        versions: [">= 0.26.0"]
      - dependency-name: "github.com/ncruces/go-sqlite3/gormlite"
        versions: [">= 0.25.0"]
